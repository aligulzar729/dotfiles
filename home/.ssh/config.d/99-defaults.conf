# Shared SSH defaults. Symlinked to ~/.ssh/config.d/99-defaults.conf by the
# `link` step, so editing this file edits every machine's defaults.
#
# 99- on purpose: ssh is FIRST-match-wins, so a catch-all has to sort LAST or
# it freezes settings before your real host blocks (10-*.conf) get a say.
# No hostnames here — this repo is public.

Host *
	# Cache a passphrase-protected key in the agent after the first unlock.
	AddKeysToAgent yes
	# Trust a host key on first sight, still refuse if it ever changes. Without
	# it, every new device re-prompts for every server you already trust.
	StrictHostKeyChecking accept-new
	# Survive NAT and idle timeouts on long sessions.
	ServerAliveInterval 60
	ServerAliveCountMax 3
